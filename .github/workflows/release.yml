name: Release

# 推送 v* 标签时触发：在三个原生 runner 上分别打包，再汇总创建 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 单平台失败不影响其它平台
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build distributables
        # --publish never：禁用 electron-builder 检测到 git tag 时的隐式 publish
        # （否则会因缺少 GH_TOKEN 报错使整个 job 失败）。发布统一由后面的 release job 负责。
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # 未配置 macOS 签名证书：关闭自动签名探测，避免 CI 因找不到证书而失败。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # 三个平台产物合并到同一目录

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true # 自动根据合并的 PR/commit 生成发布说明
          draft: false
          prerelease: false
